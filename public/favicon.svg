<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Vibrant lime-to-emerald gradient for shopping bag and growth arrow -->
    <linearGradient id="mmBagGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="45%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Deep teal/forest green gradient for financial bar columns -->
    <linearGradient id="mmBarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
  </defs>

  <!-- White squircle emblem background card -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#FFFFFF" />

  <!-- Shopping Bag Handle -->
  <path
    d="M42 41 C42 27.5 58 27.5 58 41"
    fill="none"
    stroke="url(#mmBagGradient)"
    stroke-width="4.8"
    stroke-linecap="round"
  />

  <!-- Shopping Bag Outline -->
  <!-- Left shoulder & left edge -->
  <path
    d="M42 42.5 L34 42.5 C32 42.5 31 44 30.5 46 L27.5 72 C27 75 29 76.5 32 76.5"
    fill="none"
    stroke="url(#mmBagGradient)"
    stroke-width="4.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Right shoulder (open at bottom right for the growth arrow) -->
  <path
    d="M58 42.5 L65.5 42.5 C67.5 42.5 68.5 43.8 68.8 45.5"
    fill="none"
    stroke="url(#mmBagGradient)"
    stroke-width="4.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 4 Financial Analytics Bar Columns -->
  <!-- Bar 1 (Shortest) -->
  <rect x="36" y="70" width="5.5" height="7" rx="1.8" fill="url(#mmBarGradient)" />
  <!-- Bar 2 (Medium) -->
  <rect x="44" y="65.5" width="5.5" height="11.5" rx="1.8" fill="url(#mmBarGradient)" />
  <!-- Bar 3 (Mid-Tall) -->
  <rect x="52" y="65.5" width="5.5" height="11.5" rx="1.8" fill="url(#mmBarGradient)" />
  <!-- Bar 4 (Tallest) -->
  <rect x="60" y="56" width="5.5" height="21" rx="1.8" fill="url(#mmBarGradient)" />

  <!-- Dynamic Upward Growth Trendline & Arrow -->
  <!-- Trendline Path -->
  <path
    d="M28.5 74.5 L47 57 L53.5 64.5 L67.5 49"
    fill="none"
    stroke="url(#mmBagGradient)"
    stroke-width="5.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Arrow Head -->
  <path
    d="M62 48 L71.5 46.5 L69 56.5 Z"
    fill="url(#mmBagGradient)"
    stroke="url(#mmBagGradient)"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
</svg>
